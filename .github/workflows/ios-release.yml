# Monta o app do iPhone e envia para o App Store Connect, nos Macs do GitHub.
#
# Roda quando é enviada uma etiqueta (tag) que começa com "ios-"
# (ex.: ios-1.1.0). Depois do envio, o build aparece no App Store Connect
# (TestFlight) em uns 15–30 minutos, pronto para mandar para revisão.
#
# Os arquivos privados NUNCA ficam no repositório. Vêm dos "Secrets"
# (Settings → Secrets and variables → Actions):
#   APPSTORE_API_KEY_P8              conteúdo do arquivo AuthKey_XXXX.p8 (chave com acesso Admin)
#   APPSTORE_API_KEY_ID              ID da chave (10 letras/números)
#   APPSTORE_API_ISSUER_ID           Issuer ID (aparece acima da lista de chaves)
#   GOOGLE_SERVICE_INFO_PLIST_BASE64 ios/Runner/GoogleService-Info.plist em base64
#   FIREBASE_OPTIONS_DART_BASE64     lib/firebase_options.dart em base64 (já cadastrado)
name: iPhone - envio para a App Store

on:
  push:
    tags: ['ios-*']

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: App_Pablife
    env:
      TEAM_ID: H64WU9TVPW
    steps:
      - uses: actions/checkout@v4

      # Número do build sempre maior que o anterior, sem mexer no pubspec.
      - run: echo "BUILD_NUMBER=$((2100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - name: Colocar os arquivos privados (vindos dos Secrets)
        env:
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          for v in API_KEY_P8 API_KEY_ID API_ISSUER_ID GOOGLE_PLIST FIREBASE_OPTIONS; do
            if [ -z "${!v}" ]; then echo "::error::Falta cadastrar o Secret de $v"; exit 1; fi
          done
          KEY_ID=$(printf '%s' "$API_KEY_ID" | tr -d '[:space:]')
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$API_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$(printf '%s' "$API_ISSUER_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "$GOOGLE_PLIST" | base64 -D > ios/Runner/GoogleService-Info.plist
          echo "$FIREBASE_OPTIONS" | base64 -D > lib/firebase_options.dart

      - run: flutter pub get

      - run: flutter test

      - name: Preparar o projeto do iPhone
        run: flutter build ios --release --no-codesign --build-number "$BUILD_NUMBER"

      - name: Montar (archive) com assinatura automática da Apple
        working-directory: App_Pablife/ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive | tail -40

      - name: Enviar para o App Store Connect
        working-directory: App_Pablife/ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Enviado: versão $(grep '^version:' ../pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1), build $BUILD_NUMBER"

      - name: Apagar os arquivos privados
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" ios/Runner/GoogleService-Info.plist
