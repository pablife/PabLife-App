<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PabLife: saúde, metas pessoais e compromissos em um só lugar.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PabLife">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PabLife</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tela de carregamento: aparece na hora e some quando o Flutter desenha o primeiro quadro. -->
  <style>
    html, body { margin: 0; height: 100%; background: #00343C; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: #00343C;
      transition: opacity .3s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading img { width: 96px; height: 96px; animation: pablife-pulse 1.6s ease-in-out infinite; }
    #loading .bar { width: 120px; height: 4px; border-radius: 2px; background: rgba(193, 205, 255, .2); overflow: hidden; }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #C1CDFF; animation: pablife-slide 1.2s ease-in-out infinite;
    }
    @keyframes pablife-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.92); opacity: .75; } }
    @keyframes pablife-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #loading img, #loading .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="progressbar" aria-label="Carregando o PabLife">
    <img src="splash/logo.png" alt="PabLife">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
