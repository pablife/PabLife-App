name: pablife
description: "A new Flutter project."
publish_to: "none"
version: 1.0.12+20

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  file_picker: ^8.0.0+1
  flutter_svg: ^2.2.1
  fl_chart: ^0.69.0
  fui_kit: ^2.0.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  timezone: ^0.10.1
  brasil_fields: ^1.18.0
  # Cópia de strawti-apps/strautils @ d2e6154 (ver packages/strawti_utils)
  strawti_utils:
    path: ../packages/strawti_utils
  carousel_slider: ^5.1.1
  flutter_slidable: ^3.1.0
  material_symbols_icons: ^4.2874.0
  onesignal_flutter: ^5.3.4
  firebase_core: ^4.2.1
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  firebase_crashlytics: ^5.0.4
  youtube_explode_dart: ^3.0.5
  youtube_player_flutter: ^9.1.3
  cached_network_image: ^3.4.1
  update_available: ^3.2.0+1
  uuid: ^4.5.2
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pages/onboarding/
    - assets/pages/auth/
    - assets/pages/waiting_approval/
    - assets/pages/premium/
    - assets/icons/
  # Na web o Flutter baixa todas as fontes declaradas antes da primeira tela,
  # então aqui ficam só as usadas (Elms Sans e Instrument Sans Condensed/
  # SemiCondensed não aparecem no app; itálico só no peso regular).
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/Instrument_Sans/static/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Instrument_Sans/static/InstrumentSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Instrument_Sans/static/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Instrument_Sans/static/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Instrument_Sans/static/InstrumentSans-Bold.ttf
          weight: 700
