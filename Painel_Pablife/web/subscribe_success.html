<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assinatura Realizada com Sucesso - Pablife</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #F5F5F5 0%, #E5E5E5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 52, 61, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 48px 32px;
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            animation: scaleIn 0.5s ease-out 0.2s both;
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.3);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .checkmark {
            width: 50px;
            height: 50px;
            position: relative;
        }

        .checkmark::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 20px;
            height: 40px;
            border: solid white;
            border-width: 0 4px 4px 0;
            transform: translate(-50%, -60%) rotate(45deg);
            animation: checkmarkDraw 0.4s ease-out 0.6s both;
        }

        @keyframes checkmarkDraw {
            from {
                height: 0;
                opacity: 0;
            }
            to {
                height: 40px;
                opacity: 1;
            }
        }

        h1 {
            color: #00343d;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .message {
            color: #8E8E93;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .details {
            background: #F5F5F5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
            text-align: left;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #E5E5E5;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #6B6B6B;
            font-size: 14px;
        }

        .detail-value {
            color: #00343d;
            font-size: 14px;
            font-weight: 600;
        }

        .button {
            background: #00343C;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .button:hover {
            background: #00242B;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 52, 61, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .footer-text {
            margin-top: 24px;
            color: #8E8E93;
            font-size: 14px;
        }

        .footer-text a {
            color: #00343d;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .success-icon {
                width: 80px;
                height: 80px;
            }

            .checkmark {
                width: 40px;
                height: 40px;
            }

            .checkmark::after {
                width: 16px;
                height: 32px;
                border-width: 0 3px 3px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            <div class="checkmark"></div>
        </div>
        
        <h1>Assinatura Realizada com Sucesso!</h1>
        
        <p class="message">
            Parabéns! Sua assinatura foi processada com sucesso através do Mercado Pago.
        </p>

        <div class="details">
            <div class="detail-item">
                <span class="detail-label">Status</span>
                <span class="detail-value" style="color: #4CAF50;">Ativa</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Método de Pagamento</span>
                <span class="detail-value">Mercado Pago</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Data de Confirmação</span>
                <span class="detail-value" id="confirmation-date"></span>
            </div>
        </div>
    </div>

    <script>
        // Preencher data de confirmação
        const dateElement = document.getElementById('confirmation-date');
        const now = new Date();
        const formattedDate = now.toLocaleDateString('pt-BR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        dateElement.textContent = formattedDate;
    </script>
</body>
</html>
